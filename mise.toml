# Tool versions for this repository, managed by mise (https://mise.jdx.dev).
#
# This file is the single source of truth for tool versions. The Makefile
# wraps every tool in `mise exec`, CI installs from here via jdx/mise-action,
# and Renovate keeps the pins current (see the packageRules in renovate.json).
#
# Hugo is `hugo-extended` on purpose: the site needs WebP and libsass, the
# same extended build Netlify runs. netlify.toml mirrors the version in its
# HUGO_VERSION contexts because Netlify builds with its own Hugo; Renovate
# updates both files in one PR, and `make check-hugo` fails if they drift.
#
# mjml and @lhci/cli are npm packages installed through mise's npm backend;
# node is pinned so they run on a known runtime. Renovate updates node
# minor/patch only — majors are a manual decision (renovate.json).
#
# Deliberately NO `min_version`: Netlify's build image runs its own mise
# against this file, and a floor set to a release-day-fresh version made
# every deploy fail in the dependency stage (probe-tested on PR #406).
# CI keeps its mise deterministic through the `version:` pin on each
# mise-action step instead.

[tools]
hugo-extended = "0.169.0"
shfmt = "3.14.1"
shellcheck = "0.11.0"
actionlint = "1.7.12"
vale = "3.26.0"
lychee = "0.24.2"
node = "22.23.4"
"npm:mjml" = "5.4.1"
# Frozen at 0.15.1: 0.16.0 depends on a chromium-bidi release that
# fails mise's aube trust policy (it lost the trusted-publisher evidence
# earlier versions carried). Renovate updates are disabled for this pin
# (renovate.json) — CI's lighthouse job uses treosh's bundled copy, so a
# green automerge would otherwise break every local mise install. Unfreeze
# when upstream trust evidence is restored.
"npm:@lhci/cli" = "0.15.1"
