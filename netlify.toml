[build]
publish = "public"
command = "hugo --gc --minify"

[context.production]
command = "hugo --gc --minify --enableGitInfo"
ignore = "bash scripts/netlify-ignore.sh"

[context.production.environment]
HUGO_VERSION = "0.165.0"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"
ignore = "bash scripts/netlify-ignore.sh"

[context.deploy-preview.environment]
HUGO_VERSION = "0.165.0"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"
# Disable: don't render bare branch pushes that have no PR open. PR previews
# still work via [context.deploy-preview]; production deploys via [context.production].
ignore = "exit 0"

[context.branch-deploy.environment]
HUGO_VERSION = "0.165.0"

[[plugins]]
package = "netlify-plugin-cache"

  [plugins.inputs]
  paths = [
    "resources/_gen",
    ".cache/hugo",
    ".cache/hugo_cache",
  ]

[[redirects]]
  from = "https://kakkoyun.me/notes/*"
  to = "https://publish.obsidian.md/serve?url=kakkoyun.me/notes/:splat"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# Security headers
#
# Site-wide baseline first, then the extra layer for /admin/ (Sveltia CMS).
# There is deliberately NO site-wide Content-Security-Policy: PaperMod, the
# Giscus theme sync and the JSON-LD partial all emit inline <script> blocks, so
# a site-wide policy would need 'unsafe-inline' and would buy nothing. See
# docs/sveltia-cms.md for the threat model.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# /admin/ holds a GitHub App user token in localStorage, so it gets a real CSP.
#
# Directive notes (scripts/check-admin-csp.sh enforces the ones that drift):
#   script-src  KNOWN LIMITATION: allowing the unpkg.com origin trusts every
#               script on a public CDN. SRI covers only the bundle element that
#               carries integrity=, so HTML injection could add a different
#               unpkg URL and run it under an enforcing policy. Narrowing this
#               to 'strict-dynamic' + the bundle hash is a prerequisite for the
#               flip, not a change to make blind — the bundle import()s more
#               unpkg URLs at runtime. See "Turning the CSP on" in the docs.
#
#   script-src  the two sha256 hashes are the inline blocks in
#               static/admin/index.html. Editing that file without recomputing
#               them fails `make test`. unpkg.com is needed for the bundle AND
#               for the chunks it lazily import()s at runtime (@shikijs/*,
#               @sveltia/ui, emojilib, pdf.js) — those URLs are hardcoded inside
#               the bundle, so self-hosting it would not remove the origin.
#   'wasm-unsafe-eval'  Shiki's oniguruma regex engine is WASM.
#   style-src   'unsafe-inline' is unavoidable; Svelte injects styles at runtime.
#   connect-src reduces arbitrary network egress: it closes the easy path where
#               injected code beacons the token straight to an attacker host. It
#               does NOT prevent exfiltration — api.github.com must stay allowed,
#               and a Contents:write token can commit its own value to the public
#               `cms` branch through it. No CSP closes that while the credential
#               lives in page JS. See docs/sveltia-cms.md.
#
# Deliberately absent: Cross-Origin-Opener-Policy. Sign-in is a popup that
# postMessages the token back to window.opener; COOP: same-origin severs that
# and breaks login. Do not add it.
#
# Shipped as Report-Only first. Flip to Content-Security-Policy once a soak
# period of real editing sessions comes back with no violations.
[[headers]]
  for = "/admin/*"

  [headers.values]
    # Repeated from the /* rule on purpose. Netlify does not document whether
    # headers from several matching rules are applied cumulatively or whether
    # the most specific rule wins outright, and /admin/ is the page where
    # getting that wrong matters most. Restating them costs four lines and
    # removes the dependency on undocumented behaviour.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy-Report-Only = "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://unpkg.com 'sha256-piQmbA2NkUUMqrVMMUZaZg30C7jVAu0XSCB4puvq9Q0=' 'sha256-W2VE/pUUL8ULQ2qK5UbqbLU2bxPEONOSo4ockoeB/nk='; style-src 'self' 'unsafe-inline'; font-src https://cdn.jsdelivr.net; img-src 'self' data: blob: https://*.githubusercontent.com; connect-src 'self' https://api.github.com https://api.netlify.com https://github.com https://unpkg.com https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
