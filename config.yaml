baseurl: "https://kakkoyun.me"
title: "kakkoyun"
theme: "PaperMod"

enableRobotsTXT: true

# Remote images fetched by partials/functions/responsive-image.html go through
# Hugo's "getresource" cache, which defaults to $XDG_CACHE_HOME/hugo_cache —
# a path no CI runner and no Netlify build persists. Every build therefore
# re-fetched all ~30 of them, and the cache steps meant to survive a flaky
# upstream host were protecting a directory that was never written to.
#
# Move just that cache under resources/_gen, which CI and netlify.toml already
# persist for processed images. One cached path now covers both. cacheDir itself
# is deliberately left alone: Hugo requires it to be absolute, which cannot be
# expressed portably across a laptop, a runner and Netlify.
caches:
  getresource:
    dir: :resourceDir/_gen/getresource
    maxAge: -1

# partials/functions/responsive-image.html fetches cover and inline images at
# build time, and Hugo's default policy for that is `urls: ['.*']` — any URL any
# markdown file names, requested by the build. CI builds pull request branches,
# so that reaches as far as whatever the runner or the Netlify builder can see.
#
# Restrict it to the hosts the content actually uses. Adding a remote image from
# a new host is then a deliberate one-line change here rather than a silent new
# egress from every build.
#
# What a blocked URL looks like, verified: GetRemote returns `access denied:
# "<url>" is not whitelisted in policy "security.http.urls"`, responsive-image
# logs that as a WARN naming the host and falls back to the bare remote URL, and
# scripts/check-image-sizes.sh then fails the build because that fallback has no
# dimensions. Noisy, but it fails closed and the log says exactly why.
#
# https://gohugo.io/configuration/security/
security:
  http:
    methods:
      - (?i)GET
    urls:
      - ^https://img\.youtube\.com/
      - ^https://i\.ytimg\.com/
      - ^https://raw\.githubusercontent\.com/
      - ^https://www\.polarsignals\.com/
      - ^https://wakatime\.com/
      - ^https://imgs\.xkcd\.com/

# Cover images live in static/uploads/ and are referenced as /uploads/foo.jpeg —
# by published posts, by already-syndicated Substack imports and by social cards
# that are long since posted. Moving them into assets/ to make Hugo process them
# would break every one of those URLs.
#
# So mount the directory a second time, into assets/. static/uploads keeps its
# default mount and /uploads/foo.jpeg still serves the untouched original, while
# `resources.Get "uploads/foo.jpeg"` now returns a processable resource — which
# is what lets partials/functions/responsive-image.html emit a real width and
# height for a cover instead of falling back to an unsized <img>.
#
# The `assets -> assets` line is not redundant: declaring any mount whose target
# is a component drops that component's default mount, so it has to be restated.
module:
  mounts:
    - source: assets
      target: assets
    - source: static/uploads
      target: assets/uploads

defaultContentLanguage: "en"
buildDrafts: false

pagination:
  pagerSize: 5


outputFormats:
  markdown:
    name: markdown
    baseName: index
    mediaType: text/markdown
    isPlainText: true
  llms:
    name: llms
    baseName: llms
    mediaType: text/plain
    isPlainText: true
    notAlternative: true
  # Substack-tuned syndication feed (served at /substack.xml). Full-text
  # <content:encoded> with absolutised image/link URLs and a top "Originally
  # published at" backlink. Point Substack's Settings -> Import at this feed.
  # See docs/substack-syndication.md.
  substack:
    name: substack
    baseName: substack
    mediaType: application/rss+xml
    isPlainText: false
    isHTML: false
    noUgly: true
    rel: alternate
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms
    - substack
  page:
    - HTML
    - MARKDOWN
  section:
    - HTML
    - RSS
    - MARKDOWN
  term:
    - HTML
    - MARKDOWN

