name: Update Recent Notes

on:
  workflow_dispatch:
  schedule:
    # Runs at 12am UTC
    - cron: '0 0 * * *'
permissions:
  contents: write # commit the notes list onto a branch
  pull-requests: write # open and merge the PR that lands it

jobs:
  update-readme-with-notes:
    name: Notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # v1
        with:
          readme_path: 'content/notes/_index.md'
          comment_tag_name: "NOTE-LIST"
          feed_list: "https://kakkoyun.me/notes/rss.xml"
          max_post_count: 5
          remove_duplicates: true
          disable_sort: true
          sort_order: 'desc'
          reverse_order: true
          template: "$newline - [$title]($url) $newline"
          # The action must not write to master itself: a ruleset requires every
          # change to arrive through a pull request. It still writes the file to
          # disk (the marker-splicing logic stays its job); the step below is
          # what lands it.
          skip_commit: true
          # Off, and worth knowing why it existed. Defaulting to true, this makes
          # a dummy commit straight to the default branch every ~50 days to stop
          # GitHub disabling scheduled workflows on dormant repos. That is a push
          # to master that appears nowhere in this file — invisible until it
          # fails. This repo is not dormant (posts, Renovate, CI all commit
          # regularly), so nothing here needs it.
          enable_keepalive: false

      # Land the change through a PR rather than pushing to master, so the
      # `master` ruleset needs no bypass actor for this cron. The PR is opened
      # and merged in the same step: there is nothing for a human to review in a
      # generated list, and leaving it open would just accumulate.
      #
      # This update gets NO GitHub Actions run — not on the PR, and not on the
      # push that follows the merge. GitHub suppresses workflow events produced
      # with GITHUB_TOKEN, which covers both. So build.yml, links.yml, lint.yml
      # and cms-sync.yml all stay silent here; do not rely on them to catch a
      # bad notes update. cms-sync.yml notes the same thing about its own pushes.
      #
      # That is pre-existing rather than a cost of routing through a PR: the
      # direct push this replaced used the same token and was equally silent.
      # It is also why the ruleset requires a PR but no status checks — a check
      # that never reports would hang this merge forever. Netlify still deploys,
      # since that runs off its own webhook. See docs/sveltia-cms.md.
      - name: Land the notes update through a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- content/notes/_index.md; then
            echo "No notes changes to land."
            exit 0
          fi

          branch="automation/notes-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add content/notes/_index.md
          git commit -m "ci: update recent notes"
          head_sha=$(git rev-parse HEAD)
          git push origin "$branch"

          gh pr create \
            --base master --head "$branch" \
            --title "ci: update recent notes" \
            --body "Automated: the notes list regenerated from the Obsidian Publish RSS feed. Opened and merged by \`main.yml\`."

          # GitHub can briefly report mergeability as unknown right after the PR
          # is created; retry rather than failing on that race.
          #
          # --delete-branch is deliberately NOT passed to `gh pr merge`: the
          # runner is standing on $branch, so gh would try to switch away and
          # delete it locally, and a hiccup in that cleanup exits non-zero
          # *after the merge already succeeded*. Delete the remote branch
          # separately, where failing is harmless.
          # --match-head-commit pins the merge to the commit THIS job pushed.
          # Without it there is a window between the push above and the merge
          # below in which anything holding Contents:write — a stolen CMS token,
          # say — could append a commit to this unprotected branch, and this
          # privileged workflow would merge it into master unreviewed. That is a
          # laundering path straight through the ruleset this PR exists to
          # enforce. The check is server-side and atomic, so it cannot be raced.
          drop_branch() {
            # GitHub's "automatically delete head branches" setting usually removes the
            # branch as part of the merge, so this delete finds nothing and git prints a
            # red "remote rejected ... cannot lock ref" line on an otherwise clean run.
            # The outcome was already ignored (|| true) — the guard only stops a success
            # from reading like a failure in the log.
            if git ls-remote --exit-code --heads origin "$1" >/dev/null 2>&1; then
              git push origin --delete "$1" || true
            fi
          }

          for attempt in 1 2 3; do
            if gh pr merge "$branch" --squash --match-head-commit "$head_sha"; then
              drop_branch "$branch"
              exit 0
            fi
            # A merge that landed but reported failure must not look like a
            # merge that never happened.
            if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null || echo UNKNOWN)" = "MERGED" ]; then
              drop_branch "$branch"
              exit 0
            fi
            remote_head=$(gh pr view "$branch" --json headRefOid --jq .headRefOid 2>/dev/null || echo "")
            if [ -n "$remote_head" ] && [ "$remote_head" != "$head_sha" ]; then
              echo "::error::$branch is at $remote_head, not the $head_sha this job pushed. Refusing to merge: something else wrote to the branch."
              exit 1
            fi
            echo "merge attempt $attempt failed, retrying"
            sleep $(( attempt * 5 ))
          done

          echo "::error::Could not merge the notes update PR for branch $branch. The branch is pushed and the PR is open — merge it by hand."
          exit 1
