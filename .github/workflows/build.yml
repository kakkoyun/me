name: Build & Verify

on:
  push:
    branches: [master]
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'themes/**'
      - 'static/**'
      - 'assets/**'
      - 'archetypes/**'
      - 'config.yaml'
      - '.hugo-version'
      - 'scripts/verify-build.sh'
      - '.lighthouserc.yml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'themes/**'
      - 'static/**'
      - 'assets/**'
      - 'archetypes/**'
      - 'config.yaml'
      - '.hugo-version'
      - 'scripts/verify-build.sh'
      - '.lighthouserc.yml'
      - '.github/workflows/build.yml'

jobs:
  build-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Read Hugo version
        id: hugo-version
        run: echo "version=$(cat .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true

      # Covers are now Hugo resources: local ones get resized into a WebP
      # srcset, remote ones are fetched at build time and localised. Both are
      # expensive on a cold cache and the remote fetches also make the build
      # depend on third-party hosts being up. Persisting Hugo's caches keeps
      # repeat runs fast and lets a fetched image survive a flaky upstream.
      # Netlify does the same via netlify-plugin-cache in netlify.toml.
      - name: Cache Hugo resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: resources/_gen
          key: hugo-resources-${{ runner.os }}-${{ hashFiles('assets/**', 'static/uploads/**', 'content/**/*.md', 'config.yaml') }}
          restore-keys: |
            hugo-resources-${{ runner.os }}-

      - name: Build (production)
        run: hugo --gc --minify --enableGitInfo
        env:
          HUGO_ENV: production

      - name: Verify build output
        run: bash scripts/verify-build.sh public

  lighthouse:
    runs-on: ubuntu-latest
    needs: build-verify
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Read Hugo version
        id: hugo-version
        run: echo "version=$(cat .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true

      # Covers are now Hugo resources: local ones get resized into a WebP
      # srcset, remote ones are fetched at build time and localised. Both are
      # expensive on a cold cache and the remote fetches also make the build
      # depend on third-party hosts being up. Persisting Hugo's caches keeps
      # repeat runs fast and lets a fetched image survive a flaky upstream.
      # Netlify does the same via netlify-plugin-cache in netlify.toml.
      - name: Cache Hugo resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: resources/_gen
          key: hugo-resources-${{ runner.os }}-${{ hashFiles('assets/**', 'static/uploads/**', 'content/**/*.md', 'config.yaml') }}
          restore-keys: |
            hugo-resources-${{ runner.os }}-

      - name: Build (production)
        run: hugo --gc --minify --enableGitInfo
        env:
          HUGO_ENV: production

      - name: Run Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        continue-on-error: true
        with:
          configPath: .lighthouserc.yml
          uploadArtifacts: true

      # The Lighthouse step is continue-on-error, so a failed assertion leaves no
      # mark on the job. That is how the assertions stayed red for seven weeks
      # while every run reported green: the only alarm was an issue that, once
      # open, made every later run log "skipping duplicate" and move on.
      # Write the results into the run summary so a failure is visible on the
      # run page itself, on pull requests as well as pushes.
      - name: Summarise Lighthouse assertions
        if: always()
        env:
          LHCI_OUTCOME: ${{ steps.lhci.outcome }}
        run: bash scripts/lighthouse-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Open issue on score drop
        if: steps.lhci.outcome == 'failure' && github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = 'Lighthouse score drop detected';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['lighthouse'],
            });
            let summary = 'Assertion details unavailable.';
            try {
              const results = JSON.parse(
                require('fs').readFileSync('.lighthouseci/assertion-results.json', 'utf8'));
              const failed = results.filter(r => !r.passed);
              if (failed.length) {
                summary = ['| Level | Audit | Expected | Actual |',
                           '|---|---|---|---|']
                  .concat(failed.map(r =>
                    `| ${r.level} | \`${r.auditId}\` | ${r.operator} ${r.expected} | ${r.actual} |`))
                  .join('\n');
              }
            } catch (e) {
              console.log(`Could not read assertion results: ${e.message}`);
            }

            const existing = issues.find(i => i.title === title);
            if (existing) {
              // Do not skip. An open issue used to silence every later run, so a
              // regression that persisted looked identical to one that was fixed.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: [
                  `Still failing on ${context.sha.substring(0, 7)}.`,
                  '',
                  summary,
                  '',
                  `**Run:** ${context.payload.repository.html_url}/actions/runs/${context.runId}`,
                ].join('\n'),
              });
              console.log(`Commented on existing issue #${existing.number}.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['lighthouse'],
              body: [
                '## Lighthouse score drop',
                '',
                `One or more scores dropped below thresholds on commit ${context.sha}.`,
                '',
                summary,
                '',
                `**Workflow run:** ${context.payload.repository.html_url}/actions/runs/${context.runId}`,
                '',
                'Thresholds live in `.lighthouserc.yml`. The full report is in the workflow artifacts.',
              ].join('\n'),
            });
