name: Promote New Post

on:
  schedule:
    # Every day at 6 AM UTC. Promotes any live post published within the last
    # PROMOTE_LOOKBACK_DAYS (30) that has no promotedAt stamp yet — not just
    # posts published today. See scripts/find-promotable-posts.sh.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      post_path:
        description: 'Path to a specific post (content/posts/my-post.md) — promotes it even if already promoted or outside the window. Leave blank to promote everything due and unpromoted.'
        required: false
        type: string
      dry_run:
        description: 'Install a stub buffer-cli that echoes instead of posting'
        required: false
        default: 'false'
        type: boolean

# Serialize runs. The promotedAt ledger only dedupes across runs that can see
# each other's commits: two overlapping runs — a manual dispatch firing while the
# 06:00 cron is still going — would both read an empty promotedAt and both post.
# Queueing means the second run checks out after the first has pushed its stamp.
#
# cancel-in-progress stays false: cancelling a *running* promotion could kill it
# between posting to Buffer and writing the stamp, which is the one state the
# ledger cannot recover from. GitHub may still drop a superseded *pending* run,
# which is harmless — the lookback window picks that post up the next morning.
concurrency:
  group: promote-post
  cancel-in-progress: false

jobs:
  # Publishing the site is no longer this workflow's job — that moved to
  # deploy-scheduled.yml, which rebuilds just after midnight UTC so a post goes
  # live on its publish day regardless of whether this promotion cron fires.
  # Promotion here instead guards on liveness (see "Verify posts are live"
  # below): it will not post a social link to a page that is not yet reachable.
  #
  # Triggers: the daily cron promotes any live post published within the last
  # PROMOTE_LOOKBACK_DAYS (30) that has not been promoted yet; workflow_dispatch
  # is the manual "promote now / again" button (one post via post_path, which
  # ignores both the window and the ledger, or everything due when left blank).
  # There is no push trigger — claude-code-action rejects the push event type
  # ("Unsupported event type: push"), which is exactly why the cron cannot rely
  # on a single publish-day window: a post merged after the 06:00 cron, or after
  # its publishDate had already passed, used to be missed permanently.
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # write: the "Record promotion" step below commits the promotedAt stamp
      # and lands it on master through a PR. That stamp is what stops the next
      # cron re-posting the same link, so it has to be persisted, not just
      # logged.
      contents: write
      pull-requests: write # open and merge the PR that lands the stamp
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          # Pinned to master, not the dispatch ref. workflow_dispatch can be run
          # from any branch, and checkout would otherwise follow it — so
          # "Record promotion" below would branch from that ref and its PR would
          # carry every unrelated commit on it onto master. Promotion only ever
          # acts on published content, which lives on master, so read it from
          # there.
          ref: master
          # Needed so the "Record promotion" step can push the stamp back.
          persist-credentials: true

      - name: Find promotable posts
        id: find
        # POST_PATH is passed via env, not interpolated into the script body:
        # `${{ ... }}` is expanded before bash runs, so a dispatch input containing
        # $(...) or backticks would otherwise execute on the runner (script injection).
        # As an env var it reaches bash as opaque data.
        env:
          POST_PATH: ${{ github.event.inputs.post_path }}
        run: |
          chmod +x scripts/find-promotable-posts.sh
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$POST_PATH" ]; then
            # Manual run targeting one specific post. Skips both the date window
            # and the promotedAt ledger — this is the deliberate re-promote path.
            POSTS=$(scripts/find-promotable-posts.sh manual "$POST_PATH")
          else
            # Daily cron, or a manual run with no post_path: every live post
            # published inside the lookback window that has no promotedAt yet.
            POSTS=$(scripts/find-promotable-posts.sh schedule)
          fi

          if [ -z "$POSTS" ]; then
            echo "No posts to promote"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found posts to promote:"
            echo "$POSTS"
            {
              echo "posts<<EOF"
              echo "$POSTS"
              echo "EOF"
              echo "should_run=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify posts are live
        id: live
        if: steps.find.outputs.should_run == 'true'
        # Guard against promoting a dead link: a post is only worth a social post
        # once its page is actually reachable. scripts/check-post-live.sh maps each
        # post file to its public URL (content/posts/<slug>.md → /posts/<slug>/),
        # polls it, and emits only the live ones (dropping the rest with a
        # ::warning::). Extracted into a script so the mapping/filtering logic is
        # unit-tested (scripts/test-check-post-live.sh) and shellcheck-linted,
        # rather than living untested inside this YAML.
        run: |
          set -uo pipefail
          chmod +x scripts/check-post-live.sh
          live=$(scripts/check-post-live.sh <<< "${{ steps.find.outputs.posts }}")
          if [ -z "$live" ]; then
            echo "No live posts to promote"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "posts<<EOF"
              echo "$live"
              echo "EOF"
              echo "should_run=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout humanizer skill submodule
        if: steps.live.outputs.should_run == 'true'
        run: git submodule update --init --depth 1 tools/humanizer

      - name: Install buffer-cli
        if: steps.live.outputs.should_run == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL https://github.com/erickhun/buffer-cli/releases/latest/download/buffer-linux-amd64 \
            -o "$HOME/.local/bin/buffer-cli"
          chmod +x "$HOME/.local/bin/buffer-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install buffer-cli stub (dry-run)
        if: steps.live.outputs.should_run == 'true' && github.event.inputs.dry_run == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/buffer-cli" <<'STUB'
          #!/usr/bin/env bash
          # Stub buffer-cli for dry-run: log args, never post.
          printf '[stub buffer-cli] argv:' >&2
          for a in "$@"; do printf ' %q' "$a" >&2; done
          printf '\n' >&2
          echo '{"id":"stub","scheduled_at":null}'
          STUB
          chmod +x "$HOME/.local/bin/buffer-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Promote with Claude
        if: steps.live.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@70fec183852c4f82f3f1969faed7dd60c5149ca7 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Promote the following blog post(s) to social media.

            Read .claude/commands/promote-post.md for full instructions, then execute.

            Two skills shape the writing — use them, don't just acknowledge them:

            - `kemal-voice` (.claude/skills/kemal-voice/SKILL.md) — anchors the
              author's voice and lists banned vocabulary / formulaic openers.
              Read it before drafting.
            - `humanizer` (.claude/skills/humanizer/SKILL.md) — AI-pattern
              cleanup pass. After drafting each platform's message, run it
              through the humanizer pass before posting. Apply the final
              anti-AI audit ("what makes this obviously AI-generated?" → fix).

            Posts to promote:
            ${{ steps.live.outputs.posts }}
          claude_args: --allowedTools "Read,Bash(buffer-cli:*),Bash(echo:*)"
        env:
          BUFFER_AUTH_TOKEN: ${{ secrets.BUFFER_AUTH_TOKEN }}

      # Stamp promotedAt and push. This is the ledger half of the mechanism in
      # scripts/find-promotable-posts.sh: schedule mode looks back 30 days
      # rather than at a single day, and promotedAt is what keeps it from
      # re-posting the same link every morning for a month.
      #
      # Deterministic bash writes the stamp, not Claude — same split as the
      # rest of this workflow, where Claude only writes the copy.
      #
      # Known limitation: success is only known at step granularity, so a run
      # that posted to Twitter but failed on LinkedIn still stamps as promoted.
      # Recovery is a workflow_dispatch with the post_path, which deliberately
      # ignores the ledger.
      - name: Record promotion
        if: steps.live.outputs.should_run == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/record-promotion.sh
          scripts/record-promotion.sh <<< "${{ steps.live.outputs.posts }}"

          if git diff --quiet -- content/posts/; then
            echo "No promotedAt changes to commit"
            exit 0
          fi

          # The stamp lands through a PR, not a push to master: the `master`
          # ruleset requires every change to arrive that way, and routing this
          # cron through a PR is what lets that ruleset carry no bypass actor —
          # which is the point, since a stolen CMS token is a *user* token and
          # would otherwise inherit any bypass granted here.
          branch="automation/promotion-stamp-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add content/posts/
          git commit -m "ci: record promotion timestamps"
          git push origin "$branch"

          gh pr create \
            --base master --head "$branch" \
            --title "ci: record promotion timestamps" \
            --body "Automated: promotedAt stamps for the posts promoted by this run. Opened and merged by \`promote-post.yml\`."

          # The cron and a human merge can race for master. A PR that is briefly
          # unmergeable — GitHub still computing, or master moving underneath —
          # is retried rather than failing the run outright: the posts are
          # already on social by this point, and losing the stamp means
          # tomorrow's cron promotes them a second time.
          #
          # --delete-branch is deliberately NOT passed to `gh pr merge`: the
          # runner is standing on $branch, so gh would try to switch away and
          # delete it locally, and a hiccup in that cleanup exits non-zero
          # *after the merge already succeeded* — which here would send us into
          # the rebase path against an already-merged PR. Delete the remote
          # branch separately, where failing is harmless.
          for attempt in 1 2 3; do
            if gh pr merge "$branch" --squash; then
              git push origin --delete "$branch" || true
              exit 0
            fi
            # A merge that landed but reported failure must not be retried: the
            # stamp is already on master and rebasing would only confuse things.
            if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null || echo UNKNOWN)" = "MERGED" ]; then
              git push origin --delete "$branch" || true
              exit 0
            fi
            echo "merge attempt $attempt failed, updating the branch and retrying"
            git fetch origin master
            # A conflict here is never swallowed. Continuing past one would end
            # the run with the posts promoted but unstamped — the exact
            # double-post this ledger exists to prevent, arrived at quietly.
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "::error::Rebase conflicted while recording promotion stamps. The posts below were POSTED but NOT stamped, so the next cron would promote them again. Add their promotedAt entries on master by hand (or run scripts/record-promotion.sh there) before 06:00 UTC:"
              echo "${{ steps.live.outputs.posts }}"
              exit 1
            fi
            git push --force-with-lease origin "$branch"
            sleep $(( attempt * 5 ))
          done

          echo "::error::Could not merge the promotion-stamp PR after 3 attempts. The posts below were POSTED but NOT stamped and will be promoted again by the next cron unless you add their promotedAt entries on master (branch $branch is pushed and its PR is open):"
          echo "${{ steps.live.outputs.posts }}"
          exit 1
