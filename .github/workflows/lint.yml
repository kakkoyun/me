name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Every job below runs the same binary a contributor runs locally: versions
# are pinned in mise.toml and installed by jdx/mise-action, and the `make`
# targets the other jobs run wrap tools in `mise exec --`. Before this, each
# linter was whatever version its action wrapper happened to bundle, so
# "green locally" and "green in CI" were not the same claim.
jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # shellcheck only, from mise.toml — no other tool's outage can fail
      # this job. The distinct cache_key_prefix keeps this job's cache entry
      # separate from jobs that install a different subset from mise.toml.
      - name: Install pinned ShellCheck (mise)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
          install_args: shellcheck
          cache_key_prefix: lint-shellcheck

      # Same binary and same file list as `make shellcheck`: the file list comes
      # from the Makefile itself (SHELL_FILES, discovered by shebang across the
      # whole repo) rather than a glob duplicated here. The previous
      # reviewdog/action-shellcheck step globbed `scripts/*.sh`, so a shell
      # script anywhere else was linted locally but not in CI, and its
      # ShellCheck version was whatever the action SHA baked in.
      #
      # Findings are emitted as native GitHub annotations, so they still appear
      # inline on the PR diff without a second tool choosing the binary.
      - name: ShellCheck
        run: |
          set -uo pipefail
          # Assert the pin actually won. A preinstalled tool shadowing it is a
          # silent false pass, which is worse than a red job.
          want="$(mise current shellcheck)"
          got="$(shellcheck --version | awk '/^version:/ {print $2}')"
          if [ "$got" != "$want" ]; then
            echo "::error::expected the pinned shellcheck $want, resolved $got"
            exit 1
          fi
          resolved="$(mise which shellcheck)"
          case "$resolved" in
            /home/runner/.local/share/mise/*) ;;
            *) echo "::error::shellcheck resolved outside mise: $resolved"; exit 1 ;;
          esac
          echo "shellcheck $got (from $resolved)"
          mapfile -t files < <(make -s print-shell-files)
          rc=0
          out="$(mktemp)"
          shellcheck --format=gcc "${files[@]}" >"$out" 2>&1 || rc=$?
          if [ -s "$out" ]; then
            cat "$out"
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): note: (.*)$/::notice file=\1,line=\2,col=\3::\4/;
                    s/^([^:]+):([0-9]+):([0-9]+): (warning|error): (.*)$/::\4 file=\1,line=\2,col=\3::\5/' \
              "$out"
          fi
          exit "$rc"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Both tools, not just actionlint. actionlint shells out to whatever
      # `shellcheck` is on PATH to lint `run:` blocks, and ubuntu-latest ships
      # its own. A runner tool shadowing the pins once made this job lint with
      # a different ShellCheck than the ShellCheck job beside it and than
      # `make lint` locally — findings no dev machine could reproduce failed
      # CI (SC2015, dropped in 0.11.0, did exactly that). mise installs both
      # pins and puts its shims ahead of /usr/bin; the assertions below prove
      # the pins won rather than trusting PATH order.
      - name: Install pinned actionlint and ShellCheck (mise)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
          install_args: "actionlint shellcheck"
          cache_key_prefix: lint-actionlint

      - name: actionlint
        run: |
          set -uo pipefail
          want="$(mise current actionlint)"
          got="$(actionlint --version | head -1 | awk '{print $1}')"
          if [ "$got" != "$want" ]; then
            echo "::error::expected the pinned actionlint $want, resolved $got"
            exit 1
          fi
          want_sc="$(mise current shellcheck)"
          got_sc="$(shellcheck --version | awk '/^version:/ {print $2}')"
          if [ "$got_sc" != "$want_sc" ]; then
            echo "::error::expected the pinned shellcheck $want_sc, resolved $got_sc — actionlint would lint run: blocks with a different version than make lint does"
            exit 1
          fi
          echo "actionlint $got (from $(mise which actionlint))"
          echo "shellcheck $got_sc"
          rc=0
          # -oneline gives file:line:col: message, which maps to a GitHub
          # annotation with the same sed shape the ShellCheck job uses. The
          # documented -format Go template was the obvious route but its
          # {{"\n"}} newline fails to parse ("unterminated quoted string").
          out="$(mktemp)"
          actionlint -oneline -no-color .github/workflows/*.yml >"$out" 2>&1 || rc=$?
          if [ -s "$out" ]; then
            cat "$out"
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/' \
              "$out"
          fi
          exit "$rc"

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `make fmt-check` wraps the pinned shfmt in `mise exec --`, so the job
      # installs mise plus shfmt and the target does the rest. The version
      # used to be written here AND in the Makefile, with nothing keeping the
      # two in step; it now lives only in mise.toml, which Renovate updates.
      # Formatting rules come from .editorconfig, which shfmt reads itself —
      # there are no flags here to drift out of sync.
      - name: Install pinned shfmt (mise)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
          install_args: shfmt
          cache_key_prefix: lint-shfmt

      - name: Check formatting
        run: make fmt-check

  test:
    name: Script tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run script unit tests
        run: make test
