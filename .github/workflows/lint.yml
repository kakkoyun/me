name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Every job below runs the same binary a contributor runs locally: versions are
# pinned in tools.mk and installed by scripts/ensure-tool.sh, which the `make`
# targets invoke on first use. Before this, each linter was whatever version its
# action wrapper happened to bundle, so "green locally" and "green in CI" were
# not the same claim.
jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same binary and same file list as `make shellcheck`: the file list comes
      # from the Makefile itself (SHELL_FILES, discovered by shebang across the
      # whole repo) rather than a glob duplicated here. The previous
      # reviewdog/action-shellcheck step globbed `scripts/*.sh`, so a shell
      # script anywhere else was linted locally but not in CI, and its
      # ShellCheck version was whatever the action SHA baked in.
      #
      # Findings are emitted as native GitHub annotations, so they still appear
      # inline on the PR diff without a second tool choosing the binary.
      - name: ShellCheck
        run: |
          set -uo pipefail
          make -s tool-shellcheck
          mapfile -t files < <(make -s print-shell-files)
          rc=0
          shellcheck --format=gcc "${files[@]}" >shellcheck.out 2>&1 || rc=$?
          if [ -s shellcheck.out ]; then
            cat shellcheck.out
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): note: (.*)$/::notice file=\1,line=\2,col=\3::\4/;
                    s/^([^:]+):([0-9]+):([0-9]+): (warning|error): (.*)$/::\4 file=\1,line=\2,col=\3::\5/' \
              shellcheck.out
          fi
          exit "$rc"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # actionlint's own -format template emits GitHub annotations directly.
      - name: actionlint
        run: |
          set -uo pipefail
          make -s tool-actionlint
          rc=0
          # shellcheck disable=SC2016  # a Go template for actionlint, not shell
          actionlint -format \
            '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}{{"\n"}}{{end}}' \
            .github/workflows/*.yml || rc=$?
          exit "$rc"

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No install step: `make fmt-check` fetches the pinned shfmt itself. The
      # version used to be written here AND in the Makefile, with nothing
      # keeping the two in step; it now lives only in tools.mk, which Renovate
      # updates. Formatting rules come from .editorconfig, which shfmt reads
      # itself — there are no flags here to drift out of sync.
      - name: Check formatting
        run: make fmt-check

  test:
    name: Script tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run script unit tests
        run: make test
