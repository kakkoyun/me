name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Every job below runs the same binary a contributor runs locally: versions are
# pinned in tools.mk and installed by scripts/ensure-tool.sh, which the `make`
# targets invoke on first use. Before this, each linter was whatever version its
# action wrapper happened to bundle, so "green locally" and "green in CI" were
# not the same claim.
jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same binary and same file list as `make shellcheck`: the file list comes
      # from the Makefile itself (SHELL_FILES, discovered by shebang across the
      # whole repo) rather than a glob duplicated here. The previous
      # reviewdog/action-shellcheck step globbed `scripts/*.sh`, so a shell
      # script anywhere else was linted locally but not in CI, and its
      # ShellCheck version was whatever the action SHA baked in.
      #
      # Findings are emitted as native GitHub annotations, so they still appear
      # inline on the PR diff without a second tool choosing the binary.
      # $GITHUB_PATH, not the Makefile's own PATH export: that one only reaches
      # make's recipe shells, so the `run:` block below would fall through to
      # the shellcheck preinstalled on ubuntu-latest. When it did, this job
      # passed having linted nothing with the pinned binary.
      - name: Install pinned ShellCheck
        run: |
          make -s tool-shellcheck
          make -s print-tools-bin >> "$GITHUB_PATH"

      - name: ShellCheck
        run: |
          set -uo pipefail
          # Assert the pin actually won. A preinstalled tool shadowing it is a
          # silent false pass, which is worse than a red job.
          want="$(make -s print-tools-bin)/shellcheck"
          got="$(command -v shellcheck || true)"
          if [ "$got" != "$want" ]; then
            echo "::error::expected the pinned shellcheck at $want, resolved $got"
            exit 1
          fi
          shellcheck --version | sed -n 's/^version: /shellcheck /p'
          mapfile -t files < <(make -s print-shell-files)
          rc=0
          out="$(mktemp)"
          shellcheck --format=gcc "${files[@]}" >"$out" 2>&1 || rc=$?
          if [ -s "$out" ]; then
            cat "$out"
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): note: (.*)$/::notice file=\1,line=\2,col=\3::\4/;
                    s/^([^:]+):([0-9]+):([0-9]+): (warning|error): (.*)$/::\4 file=\1,line=\2,col=\3::\5/' \
              "$out"
          fi
          exit "$rc"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Both tools, not just actionlint. actionlint shells out to whatever
      # `shellcheck` is on PATH to lint `run:` blocks, and ubuntu-latest ships
      # its own — 0.10.0 at time of writing, against the 0.11.0 pinned in
      # tools.mk. So this job silently linted with a different ShellCheck than
      # the ShellCheck job beside it and than `make lint` locally, and findings
      # that no dev machine could reproduce failed CI (SC2015, dropped in
      # 0.11.0, did exactly that). Installing the pin puts .tools/bin ahead of
      # /usr/bin and closes the hole.
      - name: Install pinned actionlint and ShellCheck
        run: |
          make -s tool-actionlint tool-shellcheck
          make -s print-tools-bin >> "$GITHUB_PATH"

      - name: actionlint
        run: |
          set -uo pipefail
          want="$(make -s print-tools-bin)/actionlint"
          got="$(command -v actionlint || true)"
          if [ "$got" != "$want" ]; then
            echo "::error::expected the pinned actionlint at $want, resolved $got"
            exit 1
          fi
          want_sc="$(make -s print-tools-bin)/shellcheck"
          got_sc="$(command -v shellcheck || true)"
          if [ "$got_sc" != "$want_sc" ]; then
            echo "::error::expected the pinned shellcheck at $want_sc, resolved $got_sc — actionlint would lint run: blocks with a different version than make lint does"
            exit 1
          fi
          echo "actionlint $(actionlint --version | head -1)"
          echo "shellcheck $(shellcheck --version | awk '/^version:/ {print $2}')"
          rc=0
          # -oneline gives file:line:col: message, which maps to a GitHub
          # annotation with the same sed shape the ShellCheck job uses. The
          # documented -format Go template was the obvious route but its
          # {{"\n"}} newline fails to parse ("unterminated quoted string").
          out="$(mktemp)"
          actionlint -oneline -no-color .github/workflows/*.yml >"$out" 2>&1 || rc=$?
          if [ -s "$out" ]; then
            cat "$out"
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/' \
              "$out"
          fi
          exit "$rc"

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No install step: `make fmt-check` fetches the pinned shfmt itself. The
      # version used to be written here AND in the Makefile, with nothing
      # keeping the two in step; it now lives only in tools.mk, which Renovate
      # updates. Formatting rules come from .editorconfig, which shfmt reads
      # itself — there are no flags here to drift out of sync.
      - name: Check formatting
        run: make fmt-check

  test:
    name: Script tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run script unit tests
        run: make test
