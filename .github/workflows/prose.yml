name: Prose Lint

on:
  push:
    branches: [master]
    paths:
      - 'content/**/*.md'
      - '.vale.ini'
      - 'styles/**'
      - 'mise.toml' # vale pin: a Renovate bump should run the new Vale before it automerges
  pull_request:
    paths:
      - 'content/**/*.md'
      - '.vale.ini'
      - 'styles/**'
      - 'mise.toml'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  vale:
    name: Vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pin Vale to the same version `make vale` runs, so a finding a
      # contributor sees locally is the finding CI reports. Without this
      # the action picked its own version. The pin lives in mise.toml (the
      # single source of truth); a plain sed keeps this job free of a mise
      # install for one number.
      - name: Read pinned Vale version
        run: echo "VALE_VERSION=$(sed -n 's/^vale *= *"\([^"]*\)".*/\1/p' mise.toml)" >> "$GITHUB_ENV"

      - name: Vale prose lint (advisory)
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: ${{ env.VALE_VERSION }}
          fail_on_error: false
          filter_mode: added
          reporter: github-pr-check
          level: info
          files: content
          token: ${{ secrets.GITHUB_TOKEN }}
