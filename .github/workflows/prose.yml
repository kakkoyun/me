name: Prose Lint

on:
  push:
    branches: [master]
    paths:
      - 'content/**/*.md'
      - '.vale.ini'
      - 'styles/**'
  pull_request:
    paths:
      - 'content/**/*.md'
      - '.vale.ini'
      - 'styles/**'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  vale:
    name: Vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pin Vale to the same version `make vale` installs (tools.mk), so a
      # finding a contributor sees locally is the finding CI reports. Without
      # this the action picked its own version.
      - name: Load pinned tool versions
        run: grep -E '^[A-Z_]+=' tools.mk >> "$GITHUB_ENV"

      - name: Vale prose lint (advisory)
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: ${{ env.VALE_VERSION }}
          fail_on_error: false
          filter_mode: added
          reporter: github-pr-check
          level: info
          files: content
          token: ${{ secrets.GITHUB_TOKEN }}
