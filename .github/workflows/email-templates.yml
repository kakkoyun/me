name: Email templates

# Validate MJML email templates on every PR that touches them.
# Surfaces both MJML syntax errors and a Hakanai-specific pitfall
# (Mustache tokens inside HTML comments --- Hakanai's pre-processor
# isn't comment-aware, so a {{description}} mention in a doc comment
# can get substituted with article body HTML at send time and break
# parsing).

on:
  push:
    branches: [master]
    paths:
      - 'templates/emails/**'
      - 'scripts/validate-emails.sh'
      - '.github/workflows/email-templates.yml'
  pull_request:
    paths:
      - 'templates/emails/**'
      - 'scripts/validate-emails.sh'
      - '.github/workflows/email-templates.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      # node + npm:mjml from mise.toml — the same pinned versions
      # `make email-validate` resolves locally, instead of a floating Node
      # major with npx fetching mjml at run time.
      - name: Install pinned node and mjml (mise)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
          install_args: "node npm:mjml"
          cache_key_prefix: email-validate

      - name: Validate email templates
        run: make email-validate
