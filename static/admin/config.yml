# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Auth goes through Netlify's OAuth provider (Site settings → Access control
# → OAuth), which holds the GitHub OAuth app's client ID and secret. Netlify's
# gateway is the default for sites hosted there, so no base_url is needed.
backend:
  name: github
  repo: kakkoyun/me
  branch: master
  commit_messages:
    create: 'post: create {{slug}}'
    update: 'post: update {{slug}}'
    delete: 'post: delete {{slug}}'

site_url: https://kakkoyun.me
media_folder: static/uploads
public_folder: /uploads

output:
  omit_empty_optional_fields: true
  yaml:
    quote: none
    indent_size: 2
    indent_sequences: true

slug:
  encoding: ascii
  clean_accents: true
  lowercase: true

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: content/posts
    sortable_fields:
      fields: [publishDate, title, date]
      default:
        field: publishDate
        direction: descending
    summary: '{{title}}'
    preview_path: 'posts/{{slug}}'
    fields:
      - label: Title
        name: title
        widget: string

      - label: Description
        name: description
        widget: string

      - label: Date
        name: date
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss[Z]'
        picker_utc: true

      - label: Publish Date
        name: publishDate
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss[Z]'
        picker_utc: true
        default: '{{now}}'

      - label: Draft
        name: draft
        widget: boolean
        default: false
        required: false

      - label: Category
        name: categories
        widget: select
        multiple: true
        min: 1
        max: 1
        options:
          - journal
          - deep-dive
          - reflection
          - engineering
          - technical-findings
          - blogmentation

      - label: Tags
        name: tags
        widget: list
        default:
          - blog

      - label: Series
        name: series
        widget: string
        required: false

      - label: Cover Image
        name: cover
        widget: object
        required: false
        fields:
          - label: Image URL
            name: image
            widget: string
          - label: Alt Text
            name: alt
            widget: string
          - label: Caption
            name: caption
            widget: string
            required: false

      - label: Show Table of Contents
        name: showToc
        widget: boolean
        required: false

      - label: TOC Open by Default
        name: tocOpen
        widget: boolean
        required: false

      - label: Canonical URL
        name: canonicalUrl
        widget: string
        required: false

      - label: Show Canonical Link
        name: showCanonicalLink
        widget: boolean
        required: false

      # promote and substack use hidden widgets: absence means "yes" and
      # false means "opt-out". A boolean widget would write false to posts
      # that never set the field, silently making them non-promotable.
      # Edit these flags directly in the markdown frontmatter.
      - name: promote
        widget: hidden
      - name: substack
        widget: hidden

      - label: Body
        name: body
        widget: richtext

      # Structural fields: present in some posts but hidden from the editor UI.
      # Declaring them prevents Sveltia from dropping them on save (Risk 1).
      - name: slug
        widget: hidden
      - name: externalLink
        widget: hidden
      - name: author
        widget: hidden
      - name: comments
        widget: hidden
      - name: image
        widget: hidden
