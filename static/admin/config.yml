# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Auth goes through Netlify's OAuth provider (Site settings → Access control
# → OAuth), which holds the client ID and secret of a GitHub App registered for
# this repo alone. Netlify's gateway is the default for sites hosted there, so
# no base_url is needed. A GitHub App rather than a classic OAuth app on
# purpose: its user token is bounded by where the app is installed AND by the
# signer's own permissions, so signing in without push access to this repo
# yields a token that can commit nothing. It can still READ — this repo is
# public, so that grants nothing github.com does not already serve anonymously.
# The write denial is the guarantee. See docs/sveltia-cms.md.
backend:
  name: github
  repo: kakkoyun/me
  # Saves land on the long-lived `cms` branch, never on master. CI opens one
  # review PR for that branch; merging it publishes. See docs/sveltia-cms.md.
  branch: cms
  # {{collection}} renders the collection's label_singular, which is why those
  # are lowercase below: it produces `post: update x`, `talk: update x`,
  # `newsletter: update x` — the repo's commit convention. A hard-coded `post:`
  # prefix would mislabel every talk and newsletter save.
  commit_messages:
    create: '{{collection}}: create {{slug}}'
    update: '{{collection}}: update {{slug}}'
    delete: '{{collection}}: delete {{slug}}'

site_url: https://kakkoyun.me
media_folder: static/uploads
public_folder: /uploads

output:
  omit_empty_optional_fields: true
  yaml:
    quote: none
    indent_size: 2
    indent_sequences: true

slug:
  encoding: ascii
  clean_accents: true
  lowercase: true

collections:
  - name: posts
    label: Posts
    label_singular: post
    folder: content/posts
    sortable_fields:
      fields: [publishDate, title, date]
      default:
        field: publishDate
        direction: descending
    summary: '{{title}}'
    preview_path: 'posts/{{slug}}'
    fields:
      - label: Title
        name: title
        widget: string

      - label: Description
        name: description
        widget: string

      - label: Date
        name: date
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss[Z]'
        picker_utc: true

      - label: Publish Date
        name: publishDate
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss[Z]'
        picker_utc: true
        default: '{{now}}'

      - label: Draft
        name: draft
        widget: boolean
        default: false
        required: false

      - label: Category
        name: categories
        widget: select
        multiple: true
        min: 1
        max: 1
        options:
          - journal
          - deep-dive
          - reflection
          - engineering
          - technical-findings
          - blogmentation

      - label: Tags
        name: tags
        widget: list
        default:
          - blog

      - label: Series
        name: series
        widget: string
        required: false

      - label: Cover Image
        name: cover
        widget: object
        required: false
        fields:
          - label: Image URL
            name: image
            widget: string
          - label: Alt Text
            name: alt
            widget: string
          - label: Caption
            name: caption
            widget: string
            required: false
          - label: Width
            name: width
            widget: number
            required: false
            value_type: int
            hint: 'Only needed when the image cannot be measured at build time; see Cover and Inline Image Conventions in CLAUDE.md'
          - label: Height
            name: height
            widget: number
            required: false
            value_type: int
            hint: 'Set together with Width, or not at all'

      - label: Show Table of Contents
        name: showToc
        widget: boolean
        required: false

      - label: TOC Open by Default
        name: tocOpen
        widget: boolean
        required: false

      - label: Canonical URL
        name: canonicalUrl
        widget: string
        required: false

      - label: Show Canonical Link
        name: showCanonicalLink
        widget: boolean
        required: false

      # promote and substack use hidden widgets: absence means "yes" and
      # false means "opt-out". A boolean widget would write false to posts
      # that never set the field, silently making them non-promotable.
      # Edit these flags directly in the markdown frontmatter.
      - name: promote
        widget: hidden
      - name: substack
        widget: hidden

      # promotedAt is the promotion ledger: scripts/record-promotion.sh appends
      # a timestamp after each successful run, and find-promotable-posts.sh
      # skips any post that has one. Hidden rather than a list widget because
      # nothing should edit it by hand — and because an undeclared key is
      # dropped by the CMS on save, which would silently re-promote the post.
      - name: promotedAt
        widget: hidden

      - label: Body
        name: body
        widget: richtext

      # Structural fields: present in some posts but hidden from the editor UI.
      # Declaring them prevents Sveltia from dropping them on save (Risk 1).
      - name: slug
        widget: hidden
      - name: externalLink
        widget: hidden
      - name: author
        widget: hidden
      - name: comments
        widget: hidden
      - name: image
        widget: hidden

  # Hugo's _index.md is hidden from a folder collection unless index_file is
  # set. Neither collection below sets it, so the `comments: false` those two
  # index pages carry is never routed through the CMS and cannot be dropped.
  - name: talks
    label: Talks
    label_singular: talk
    folder: content/talks
    sortable_fields:
      fields: [publishDate, title, date]
      default:
        field: publishDate
        direction: descending
    summary: '{{title}}'
    preview_path: 'talks/{{slug}}'
    # The default slug template derives the filename from the title, and every
    # talk title carries a "talk: " prefix — so a new entry saves as
    # talk-ebpf-safety-first.md rather than ebpf-safety-first.md. Rename the
    # file after creating a talk. An editable {{fields._slug}} template would
    # fix this but blocks saving existing entries (dropped in PR1).
    fields:
      - label: Title
        name: title
        widget: string
        hint: 'Prefix with "talk: " by convention, e.g. talk: eBPF? Safety First!'

      - label: Description
        name: description
        widget: string
        required: false

      - label: Date
        name: date
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss[Z]'
        picker_utc: true

      - label: Publish Date
        name: publishDate
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss[Z]'
        picker_utc: true
        default: '{{now}}'

      # Always exactly one value, "talks". multiple: true keeps it a YAML list
      # — a plain select serializes a scalar and changes the shape Hugo reads.
      - label: Category
        name: categories
        widget: select
        multiple: true
        min: 1
        max: 1
        options:
          - talks
        default:
          - talks

      - label: Tags
        name: tags
        widget: list
        default:
          - talks

      - label: Cover Image
        name: cover
        widget: object
        required: false
        fields:
          - label: Image URL
            name: image
            widget: string
            hint: 'YouTube thumbnail: https://img.youtube.com/vi/VIDEO_ID/maxresdefault.jpg'
          - label: Alt Text
            name: alt
            widget: string
          - label: Caption
            name: caption
            widget: string
            required: false
          - label: Width
            name: width
            widget: number
            required: false
            value_type: int
            hint: 'Only needed when the image cannot be measured at build time; see Cover and Inline Image Conventions in CLAUDE.md'
          - label: Height
            name: height
            widget: number
            required: false
            value_type: int
            hint: 'Set together with Width, or not at all'

      # Raw mode only: every talk body embeds a YouTube <iframe>, and the
      # Lexical rich-text editor round-trips Markdown, not HTML. Rich-text mode
      # risks rewriting those embeds on save.
      - label: Body
        name: body
        widget: richtext
        modes: [raw]

  - name: the-unwind
    label: The Unwind
    label_singular: newsletter
    folder: content/newsletter/the-unwind
    sortable_fields:
      fields: [publishDate, title, date]
      default:
        field: publishDate
        direction: descending
    summary: '{{title}}'
    preview_path: 'newsletter/the-unwind/{{slug}}'
    fields:
      - label: Title
        name: title
        widget: string

      - label: Description
        name: description
        widget: string

      - label: Date
        name: date
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss[Z]'
        picker_utc: true

      - label: Publish Date
        name: publishDate
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss[Z]'
        picker_utc: true
        default: '{{now}}'

      - label: Draft
        name: draft
        widget: boolean
        default: false
        required: false

      - label: Body
        name: body
        widget: richtext
