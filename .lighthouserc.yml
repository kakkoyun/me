ci:
  collect:
    # Serve the built public/ directory locally
    staticDistDir: ./public
    # Three runs let LHCI take the median and absorb the ~5-point
    # run-to-run variance the GitHub-hosted runner produces.
    numberOfRuns: 3
    # Check the homepage — representative of all pages
    url:
      - "http://localhost/"

  assert:
    assertions:
      # Category floors. A11y/best-practices/SEO are stable across runs
      # on a static site, so they sit just under the post-fix scores.
      # Performance has more headroom because the runner's variance
      # alone can move the score by 5+ points.
      "categories:performance":
        - error
        - minScore: 0.9
      "categories:accessibility":
        - error
        - minScore: 0.97
      "categories:best-practices":
        - error
        - minScore: 0.95
      "categories:seo":
        - error
        - minScore: 0.97

      # Per-audit assertions for regressions the category floors won't
      # catch on their own. Each one corresponds to an issue we hit (and
      # fixed) in #171; keep them as hard errors so re-introducing them
      # blocks merges.

      # CLS: Lighthouse's "good" boundary is 0.1. The home page banner
      # was at 0.117 before the fix; lock it under that bar.
      "cumulative-layout-shift":
        - error
        - maxNumericValue: 0.1

      # Robots.txt validity. Lost SEO points the last time a non-standard
      # directive crept in.
      "robots-txt": error

      # Accessibility audit that previously failed on the home page.
      # (presentation-role-conflict was the other one — it lives in
      # Lighthouse 13+ and isn't bundled with @lhci/cli yet, so the
      # tightened accessibility floor above is what catches it.)
      "link-in-text-block": error

      # Image attributes — the banner regressed both of these when first
      # given explicit width/height without `height: auto` CSS.
      "image-aspect-ratio": error
      "image-size-responsive": error

      # Was a warning, on the premise that covers in static/uploads/
      # "legitimately can't be sized without moving them into assets/".
      # That premise no longer holds: static/uploads is mounted into
      # assets/ as well (see module.mounts in config.yaml), so covers are
      # real Hugo resources, and remote covers are fetched at build time.
      # Every <img> now comes from partials/functions/responsive-image.html,
      # which always emits width and height — so an unsized image is a
      # regression, not a known limitation.
      #
      # scripts/check-image-sizes.sh is the primary guard, because it scans
      # the whole built site where this only ever sees the home page. Keep
      # both: this one catches images resolved at runtime that a static scan
      # of the HTML would miss.
      "unsized-images": error

      # Byte-level image opportunities, kept advisory. Both are weight-0 in
      # the performance score and their numbers move with third-party
      # sources, so they are here to stay visible in the report rather than
      # to block a merge.
      "uses-responsive-images": warn
      "modern-image-formats": warn

      # Console errors — sandbox MITM-style failures aren't real, so we
      # stay informational rather than blocking on this in CI.
      "errors-in-console": warn
